name: Release (Stable)

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@v22

      - name: Validate release tag and source version
        run: |
          tag="${{ github.ref_name }}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vX.Y.Z: $tag" >&2
            exit 1
          fi
          version="${tag#v}"
          test "$(perl tes3cmd --version)" = "tes3cmd $version"
          test "$(nix eval --raw .#packages.x86_64-linux.default.version)" = "$version"

      - name: Test release source
        run: nix flake check --print-build-logs

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release $tag already exists"
            exit 0
          fi

          notes_file="$RUNNER_TEMP/release-notes.md"
          if [ "$tag" = "v0.40.0" ]; then
            nix run nixpkgs#git-cliff -- \
              "f72e9ed..$tag" \
              --strip all \
              --output "$notes_file"
          else
            nix run nixpkgs#git-cliff -- \
              --current \
              --strip all \
              --output "$notes_file"
          fi
          if [ ! -s "$notes_file" ]; then
            printf '_No notable changes._\n' > "$notes_file"
          fi
          gh release create "$tag" \
            --title "$tag" \
            --notes-file "$notes_file"
